# Single source of truth for every date, cost and parameter in the study.
# Dates are UTC calendar days, inclusive at both ends. src/config.py converts each
# period to a half-open millisecond interval [start_ms, end_ms).
# null = not decided yet. Fill it in by hand and log the choice in DECISIONS.md.

# --- Sample split (locked in Phase 0; do not change) -----------------------------
periods:
  sample:
    start: "2024-08-01"
    end: "2026-10-31"
  design:            # exploration and strategy design
    start: "2024-08-01"
    end: "2026-06-30"
  holdout:           # untouched until Phase 5; run once after the v1-frozen tag
    start: "2026-07-01"
    end: "2026-10-31"

# --- Coin universe ---------------------------------------------------------------
# Rule (docs/plan.md, Phase 1): listed as a perp on both venues for the whole sample;
# rank by average daily Hyperliquid volume over the selection window; take the top
# 12-15; always include the anchors. Chosen by hand, before looking at funding data.
universe:
  selection_window:
    start: "2024-08-01"
    end: "2024-10-31"
  min_coins: 12
  max_coins: 15
  anchors: [BTC, ETH, SOL]
  coins: []          # PLACEHOLDER: fill in after ranking; record list + rule in DECISIONS.md

# Hand-written symbol map, one entry per coin in universe.coins.
# unit: how many base-coin units one contract price refers to (1 for normal contracts,
# 1000 for kPEPE / 1000PEPEUSDT style). Prices are divided by unit before comparing.
# Example:
#   BTC:   {hyperliquid: BTC,   binance: BTCUSDT,      hl_unit: 1,    bn_unit: 1}
#   kPEPE: {hyperliquid: kPEPE, binance: 1000PEPEUSDT, hl_unit: 1000, bn_unit: 1000}
symbols: {}

# --- Fees (basis points of notional per fill; 1 bp = 0.01%) -----------------------
fees:
  hyperliquid:       # base tier, perps
    taker_bps: 4.5   # 0.045%
    maker_bps: 1.5   # 0.015%
  binance:           # base tier, USD-M futures. Copy from Binance's current fee page.
    taker_bps: null
    maker_bps: null

# --- Slippage (bps per fill) -------------------------------------------------------
# Provisional values from docs/plan.md Phase 4 item 3; varied in Phase 5.
slippage:
  majors_bps: 2.0    # coins listed in slippage.majors
  others_bps: 8.0
  majors: [BTC, ETH]

# --- Execution ---------------------------------------------------------------------
execution:
  fill: next_bar_open  # decide at close of hour t, fill at open of t+1
  hyperliquid_leg: taker
  binance_leg: taker

# --- Margin and capital (Phase 4; not decided yet) ---------------------------------
margin:
  leverage_per_leg: null
  maintenance_margin_frac: null
  capital_buffer_frac: null
  forced_close_penalty_bps: null
  rebalance_trigger_frac: null
  withdrawal_fee_usd: null
  transfer_delay_hours: null

# --- Strategy (decided in writing after Phase 3, prompt 2.4) -----------------------
strategy:
  theta_in_apr: null
  confirm_hours: null      # k consecutive hours above theta_in
  theta_out_apr: null
  max_hold_hours: null
  spread_stop_frac: null
  notional_per_position_usd: null
  max_concurrent_positions: null
  max_positions_per_coin: null

# --- Data locations ----------------------------------------------------------------
paths:
  raw: data/raw        # data/raw/<venue>/<dataset>/<coin>.parquet
  clean: data/clean
