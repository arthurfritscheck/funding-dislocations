# Single source of truth for every date, cost and parameter in the study.
# Dates are UTC calendar days, inclusive at both ends. src/config.py converts each
# period to a half-open millisecond interval [start_ms, end_ms).
# null = not decided yet. Fill it in by hand and log the choice in DECISIONS.md.

# --- Sample split (locked in Phase 0; do not change) -----------------------------
periods:
  sample:
    start: "2024-08-01"
    end: "2026-10-31"
  design:            # exploration and strategy design
    start: "2024-08-01"
    end: "2026-06-30"
  holdout:           # untouched until Phase 5; run once after the v1-frozen tag
    start: "2026-07-01"
    end: "2026-10-31"

# --- Coin universe ---------------------------------------------------------------
# Rule (docs/plan.md, Phase 1): listed as a perp on both venues for the whole sample;
# rank by average daily Hyperliquid volume over the selection window; take the top
# 12-15; always include the anchors. Chosen by hand, before looking at funding data.
universe:
  selection_window:
    start: "2024-08-01"
    end: "2024-10-31"
  min_coins: 12
  max_coins: 15
  anchors: [BTC, ETH, SOL]
  # Fixed 2026-11-04 (DECISIONS.md), from report/universe_candidates.csv; ordered by rank.
  coins: [BTC, ETH, SOL, kPEPE, SUI, WIF, TIA, DOGE, WLD, AAVE, APT, kBONK, AVAX, TAO, BNB]

# Hand-written symbol map, one entry per coin in universe.coins.
# unit: how many base-coin units one contract price refers to (1 for normal contracts,
# 1000 for kPEPE / 1000PEPEUSDT style). Prices are divided by unit before comparing.
# Example:
#   BTC:   {hyperliquid: BTC,   binance: BTCUSDT,      hl_unit: 1,    bn_unit: 1}
#   kPEPE: {hyperliquid: kPEPE, binance: 1000PEPEUSDT, hl_unit: 1000, bn_unit: 1000}
symbols:
  BTC:   {hyperliquid: BTC,   binance: BTCUSDT,      hl_unit: 1,    bn_unit: 1}
  ETH:   {hyperliquid: ETH,   binance: ETHUSDT,      hl_unit: 1,    bn_unit: 1}
  SOL:   {hyperliquid: SOL,   binance: SOLUSDT,      hl_unit: 1,    bn_unit: 1}
  kPEPE: {hyperliquid: kPEPE, binance: 1000PEPEUSDT, hl_unit: 1000, bn_unit: 1000}
  SUI:   {hyperliquid: SUI,   binance: SUIUSDT,      hl_unit: 1,    bn_unit: 1}
  WIF:   {hyperliquid: WIF,   binance: WIFUSDT,      hl_unit: 1,    bn_unit: 1}
  TIA:   {hyperliquid: TIA,   binance: TIAUSDT,      hl_unit: 1,    bn_unit: 1}
  DOGE:  {hyperliquid: DOGE,  binance: DOGEUSDT,     hl_unit: 1,    bn_unit: 1}
  WLD:   {hyperliquid: WLD,   binance: WLDUSDT,      hl_unit: 1,    bn_unit: 1}
  AAVE:  {hyperliquid: AAVE,  binance: AAVEUSDT,     hl_unit: 1,    bn_unit: 1}
  APT:   {hyperliquid: APT,   binance: APTUSDT,      hl_unit: 1,    bn_unit: 1}
  kBONK: {hyperliquid: kBONK, binance: 1000BONKUSDT, hl_unit: 1000, bn_unit: 1000}
  AVAX:  {hyperliquid: AVAX,  binance: AVAXUSDT,     hl_unit: 1,    bn_unit: 1}
  TAO:   {hyperliquid: TAO,   binance: TAOUSDT,      hl_unit: 1,    bn_unit: 1}
  BNB:   {hyperliquid: BNB,   binance: BNBUSDT,      hl_unit: 1,    bn_unit: 1}

# --- Fees (basis points of notional per fill; 1 bp = 0.01%) -----------------------
fees:
  hyperliquid:       # base tier, perps
    taker_bps: 4.5   # 0.045%
    maker_bps: 1.5   # 0.015%
  binance:           # base tier (VIP 0), USD-M futures, no BNB discount; confirmed by the user
    taker_bps: 5.0   # 0.050%  (DECISIONS.md, 2026-11-04)
    maker_bps: 2.0   # 0.020%

# --- Slippage (bps per fill) -------------------------------------------------------
# Provisional values from docs/plan.md Phase 4 item 3; varied in Phase 5.
slippage:
  majors_bps: 2.0    # coins listed in slippage.majors
  others_bps: 8.0
  majors: [BTC, ETH]

# --- Execution ---------------------------------------------------------------------
execution:
  fill: next_bar_open  # decide at close of hour t, fill at open of t+1
  hyperliquid_leg: taker
  binance_leg: taker

# --- Margin and capital (Phase 4; DECISIONS.md 2026-11-08; null = not decided yet) ----
margin:
  leverage_per_leg: 3
  maintenance_margin_frac: null
  capital_buffer_frac: null
  forced_close_penalty_bps: null
  rebalance_trigger_frac: 0.5      # move collateral when a leg's margin < 50% of its initial margin
  withdrawal_fee_usd: 1.0
  transfer_delay_hours: 2
  # Returns are reported on total capital: initial margin on both venues plus the buffer.
  return_base: total_capital

# --- Strategy (decided in writing after Phase 3, prompt 2.4) -----------------------
# Baseline signal (DECISIONS.md, 2026-11-04; replaces the plan's 20% APR / 3-hour rule):
# signal = per-coin trailing mean of the known-at-t gap over signal_window_days; enter when
# |signal| > theta_in_apr, shorting the higher-funding venue and going long the other; exit when
# |signal| < theta_out_apr or the signal changes sign. No regime filters in the baseline.
strategy:
  signal: trailing_mean_known_gap
  signal_window_days: 7
  # Robustness grid (DECISIONS.md 2026-11-08): checks only, never used to re-pick parameters.
  robustness:
    theta_in_apr: [0.05, 0.075, 0.10, 0.15, 0.20]
    theta_out_apr: [0.0, 0.015, 0.03, 0.05]
    signal_window_days: [7, 14, 30]
  regime_filters: []                 # none in the baseline
  theta_in_apr: 0.10
  confirm_hours: 0         # no k-hour confirmation; the 7-day mean replaces it
  theta_out_apr: 0.03
  exit_on_sign_change: true
  direction: short_higher_funding    # short the venue with higher funding, long the other
  max_hold_hours: .inf               # no maximum holding period; the exit rule closes positions
  spread_stop_frac: 0.01             # close if ln(p_hl/p_bn) moves 100 bps against from entry
  notional_per_position_usd: 10000   # per leg; same coin quantity on both legs
  max_concurrent_positions: 15
  max_positions_per_coin: 1

# --- Cleaning (DECISIONS.md, 2026-11-04) -------------------------------------------
cleaning:
  off_hour_tolerance_min: 5         # funding stamps further than this from the hour are flagged
  binance_intervals_h: [1, 4, 8]    # any other settlement spacing is flagged
  # Checked suspect_missing settlements: the listed settlement keeps the neighbouring interval and
  # the settlement before it counts as missing (zero funding in P&L, last value carried forward).
  # Unlisted suspect_missing rows keep their measured interval and flag until checked.
  binance_missing_settlements:
    - {symbols: [WIFUSDT, TIAUSDT, 1000BONKUSDT, TAOUSDT], settle: "2026-06-24T08:00", interval_h: 4}
  hl_funding_cap_per_hour: 0.04     # Hyperliquid cap, 4% per hour
  cap_near_frac: 0.95               # |rate| >= this share of the cap is flagged "near cap"
  spread_flag_abs: 0.02             # |log price spread| above this is flagged

# --- Analysis (Phase 3) ------------------------------------------------------------
analysis:
  # Resting rate = documented interest baseline, the funding rate when the premium sits inside
  # the clamp: 0.01% per 8h on both venues (0.00125% per hour; on Binance 0.01% x interval/8 per
  # settlement, i.e. 0.005% for 4h and 0.00125% for 1h symbols). A rate within the tolerance
  # counts as resting. The most frequent observed rate is reported only as a sanity check.
  interest_rate_per_8h: 0.0001
  # Per-symbol Binance overrides, from Binance's GET /fapi/v1/premiumIndex `interestRate`
  # (snapshot 2026-11-04, assumed constant over the sample; DECISIONS.md).
  binance_interest_overrides_per_8h:
    BNBUSDT: 0.0
  resting_tolerance_per_hour: 1.0e-10
  gap_thresholds_apr: [0.10, 0.25, 0.50]
  baseline_window_days: 30           # trailing window separating the slow-moving part of the gap
  episodes_end_on_sign_change: true  # DECISIONS.md 2026-11-04: a sign change ends the episode
  # Example mid-cap for the gap-over-time chart, fixed before computing gap statistics: the
  # median non-anchor coin by Aug-Oct 2024 HL volume (6th of the 12 non-anchor coins).
  mid_cap_example: WLD

# --- Data locations ----------------------------------------------------------------
paths:
  raw: data/raw        # data/raw/<venue>/<dataset>/<coin>.parquet
  clean: data/clean
